name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: فحوص الموقع (صياغة، صفحات، أسرار، تطابق الأسعار والترجمة)
        run: node scripts/check.js
      - name: اختبارات الحجز والدفع
        run: node --test tests/*.test.js
